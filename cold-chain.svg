<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Cold chain: source, cold storage, reefer truck and customer, all kept within 2 to 8 degrees Celsius" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d2b3e"/></marker></defs>
<rect width="640" height="300" fill="#eaf4f7"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#0d2b3e" text-anchor="middle">
<text x="320" y="38" font-size="19" font-weight="700">One unbroken cold chain, from source to customer</text>
<g fill="#0d2b3e"><rect x="24" y="70" width="120" height="80" rx="10"/><rect x="184" y="70" width="120" height="80" rx="10"/><rect x="344" y="70" width="120" height="80" rx="10" fill="#0f8b8d"/><rect x="504" y="70" width="120" height="80" rx="10"/></g>
<g fill="#fff" font-size="15" font-weight="700"><text x="84" y="106">Source</text><text x="244" y="106">Cold storage</text><text x="404" y="106">Reefer truck</text><text x="564" y="106">Customer</text></g>
<g fill="#cfe9ee" font-size="12"><text x="84" y="128">Farm or factory</text><text x="244" y="128">Kolkata hub</text><text x="404" y="128">Live monitoring</text><text x="564" y="128">Hospital or store</text></g>
<g stroke="#0d2b3e" stroke-width="2.5" marker-end="url(#a)"><path d="M146 110h36"/><path d="M306 110h36"/><path d="M466 110h36"/></g>
<rect x="24" y="180" width="600" height="86" rx="10" fill="#bfe8e9"/>
<text x="40" y="203" font-size="14" text-anchor="start" font-weight="700">Safe band: 2°C to 8°C</text>
<path d="M40 238L130 232L220 240L310 234L400 241L490 233L610 238" stroke="#0f8b8d" stroke-width="3" fill="none"/>
<text x="610" y="258" font-size="12" text-anchor="end">Data logger reading at every step</text>
